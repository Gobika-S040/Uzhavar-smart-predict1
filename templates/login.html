```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Uzhavar Crop Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #a5d6a7);
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #0002;
        }

        h1 {
            color: #237a3b;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #237a3b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #185c2b;
        }

        .error {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>🌱 Uzhavar</h1>
        <p class="subtitle">Crop Prediction System</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Login</button>
        </form>
    </main>
    
<p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>

</body>
</html>
```
