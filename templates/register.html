
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Uzhavar Crop Prediction</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eef7ee;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 6px 24px #00000012;
        }
        h1 { color: #246b35; text-align: center; }
        p { color: #555; text-align: center; }
        label { display: block; margin-top: 15px; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 7px;
            background: #26743a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .message { color: #b42318; margin-top: 12px; }
        a { color: #26743a; }
    </style>
</head>
<body>
    <main class="card">
        <h1>🌱 Create Account</h1>
        <p>Join Uzhavar Crop Prediction</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username"
                   minlength="3" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" required autocomplete="new-password">

            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password"
                   type="password" minlength="8" required
                   autocomplete="new-password">

            <button type="submit">Register</button>
        </form>

        <p>Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </main>
</body>
</html>
